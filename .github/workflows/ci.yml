name: CI Pipeline

# This pipeline is triggered on push events to the main branch and on pull requests.
# It ensures code quality and correctness using modern Python tooling.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'uv'

      - name: Install Dependencies with uv
        run: |
          python -m uv install --frozen-lockfile
          # If no lockfile exists, install from pyproject.toml and create a lockfile
          if [ ! -f requirements.txt ]; then
            python -m uv pip install --no-deps -e . --sync --locked
          fi

      - name: Lint and Format with Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run Tests with Pytest
        run: |
          pytest --cov=src/ --cov-report=xml

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
